name: nail_studio
description: Nail Studio Client Management & Loyalty App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase - updated versions
  firebase_core: ^3.6.0
  cloud_firestore: ^5.4.4
  firebase_auth: ^5.3.1

  # UI & Animations
  google_fonts: ^6.1.0
  flutter_animate: ^4.5.0
  confetti: ^0.7.0

  # Utilities
  intl: ^0.19.0
  shared_preferences: ^2.2.2
  
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/animations/
